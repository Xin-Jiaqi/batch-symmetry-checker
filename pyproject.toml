[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-symmetry-checker"
version = "0.2.0"
description = "Versioned batch symmetry reports for periodic crystal structures"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jiaqi Xin"}]
license = {file = "LICENSE"}
keywords = ["crystallography", "materials-science", "spglib", "symmetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Typing :: Typed",
]
dependencies = [
  "pymatgen>=2024.1",
  "spglib>=2.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1", "pandas>=2.0"]
test = ["build>=1.2", "openpyxl>=3.1", "packaging>=25", "pandas>=2.0", "pytest>=8", "ruff>=0.8", "twine>=5"]

[project.scripts]
batch-symmetry-checker = "batch_symmetry_checker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
