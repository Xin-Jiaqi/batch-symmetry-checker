[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-symmetry-checker"
version = "0.1.0"
description = "Batch crystal-structure symmetry analysis with pymatgen and spglib"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pymatgen>=2024.1",
  "spglib>=2.0",
]

[project.scripts]
batch-symmetry-checker = "batch_symmetry_checker:main"

[tool.setuptools]
py-modules = ["batch_symmetry_checker"]
