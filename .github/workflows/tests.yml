name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: CLI smoke test
        run: batch-symmetry-checker --version
      - name: Build distributions
        if: matrix.python-version == '3.14'
        run: python -m build
      - name: Check distributions
        if: matrix.python-version == '3.14'
        run: python -m twine check dist/*
      - name: Install and smoke-test built wheel
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "from pathlib import Path; from pymatgen.core import Lattice, Structure; Path('wheel-smoke').mkdir(); Structure(Lattice.cubic(4), ['Si'], [[0,0,0]]).to(filename='wheel-smoke/POSCAR', fmt='poscar')"
          batch-symmetry-checker --input wheel-smoke --output wheel-smoke.json --tolerances 1e-3 --quiet
          python -c "import json; assert json.load(open('wheel-smoke.json'))['status'] == 'complete'"
